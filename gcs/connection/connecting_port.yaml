# connecting_port.yaml — 현재 활성 연결 설정
#
# gcs 폴더의 스크립트들은 모두 이 파일을 읽는다. 직접 고치지 말고
# 사람별 CSV를 만들어 change.py 로 적용할 것.
#
#   python3 change.py MJ.csv       MJ 노트북 설정으로 전환
#   python3 change.py --list       사용 가능한 CSV 목록
#   python3 change.py --show       지금 값 보기
#
# 적용 후에는 서비스를 다시 시작해야 반영된다.
#   sudo systemctl restart gcs

active: TS_NAVY513
description: TS_NAVY513 via Tailscale

# 지상국 (텔레메트리를 받는 쪽)
gcs_host: 100.121.141.119
telemetry_port: 14556

# 지상국 내부에서 대기 에이전트가 GCS에 넘겨주는 루프백 포트.
# 파이는 쓰지 않지만 기록해 둔다.
relay_port: 14551

# 지상국이 자기 상태를 파이로 되보내는 포트. link.sh 가 여기서 듣는다.
ack_port: 14552

# 파이에서 gui.sh 를 볼 때 gcs -> tee.py 로 넘기는 루프백 포트.
# 외부에 열리지 않는다.
tee_port: 14553

# 기체 쪽 설정 (사람이 바뀌어도 그대로)
# 픽스호크는 USB 포트를 두 개 내놓는다(-if00=ttyACM0, -if02=ttyACM1).
# mav.py 가 -if00 을 쓰므로 gcs 는 -if02 를 쓴다. 같은 포트를 둘이 열면
# 바이트가 나뉘어 양쪽 MAVLink 파서가 모두 깨진다.
pixhawk_device: /dev/serial/by-id/usb-ArduPilot_PH4-mini_350032000150315939353320-if02
pixhawk_baud: 460800
send_hz: 10
video_fps: 16
